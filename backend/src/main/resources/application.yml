spring:
#  profiles:
#    active: local
  main:
    banner-mode: "off"
    lazy-initialization: true
  devtools:
    restart:
      poll-interval: 1s
      quiet-period: 200ms
  application:
    name: spring
  output:
    ansi:
      enabled: ALWAYS
  thymeleaf:
    cache: false
    check-template-location: false
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: 8081
  servlet:
    context-path: /api
  error:
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    token:
      secret-key: ${SECRET_KEY}
      expire-length: ${EXPIRATION_TIME}
  user:
    name:
    password: